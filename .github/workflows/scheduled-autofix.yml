name: Scheduled autofix with opencode

# Automatically fix scheduled (`schedule` event) failures of the regular
# automation workflows by running `opencode run` headlessly and pushing
# a fix commit DIRECTLY to `main`.
#
# Required setup:
# - `vars.OPENCODE_MODEL`: model in `provider/model` format (required).
#   Intended for OpenCode Go, e.g. `opencode-go/<model>`.
# - `secrets.OPENCODE_GO_API_KEY`: API key for the model provider (required).
#
# Duplicate launches are suppressed by the guard step below (another autofix
# active, stale failure, or a fix already landed) plus the concurrency group.
#
# Covered workflows:
# - Weekly build and testing (upstream-build.yml, weekly Monday schedule)
# - Build and publish latest ASP.NET Core tags to NuGet (ci.yml, 2nd-Tuesday schedule)

on:
  workflow_run:
    workflows:
      - Weekly build and testing
      - Build and publish latest ASP.NET Core tags to NuGet
    types:
      - completed
  workflow_dispatch:
    inputs:
      failed_run_id:
        description: Failed run ID to fix (empty = latest failed run of the workflow below)
        required: false
        type: string
      workflow_name:
        description: Failed workflow name (when run manually)
        required: false
        default: Weekly build and testing
        type: string

permissions:
  contents: write
  actions: read

concurrency:
  group: scheduled-autofix
  cancel-in-progress: false

jobs:
  autofix:
    if: >-
      (github.event_name == 'workflow_run' &&
        github.event.workflow_run.conclusion == 'failure' &&
        github.event.workflow_run.event == 'schedule') ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: latest

      - name: Guard against duplicate autofix
        id: guard
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_RUN_ID: ${{ github.event.workflow_run.id }}
          EVENT_WORKFLOW: ${{ github.event.workflow_run.name }}
          EVENT_SHA: ${{ github.event.workflow_run.head_sha }}
          INPUT_RUN_ID: ${{ inputs.failed_run_id }}
          INPUT_WORKFLOW: ${{ inputs.workflow_name }}
        run: |
          # Resolve target run/workflow/SHA: automatic trigger uses the
          # workflow_run payload, manual trigger uses workflow_dispatch inputs.
          # (Resolved in shell so a null workflow_run payload safely falls back
          # to empty instead of erroring on property access.)
          if [ "$EVENT_NAME" = "workflow_run" ]; then
            FAILED_RUN_ID="$EVENT_RUN_ID"
            FAILED_WORKFLOW="$EVENT_WORKFLOW"
            FAILED_SHA="$EVENT_SHA"
          else
            FAILED_RUN_ID="$INPUT_RUN_ID"
            FAILED_WORKFLOW="${INPUT_WORKFLOW:-Weekly build and testing}"
            FAILED_SHA=""
          fi
          # When no run ID was given manually, default to the latest failed run
          # of the selected workflow on main so the prompt always has a target.
          if [ -z "$FAILED_RUN_ID" ] && [ -n "$FAILED_WORKFLOW" ]; then
            FAILED_RUN_ID="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow "$FAILED_WORKFLOW" --branch main --status failure --limit 1 --json databaseId --jq '.[0].databaseId // empty')"
            echo "Resolved latest failed run: ${FAILED_RUN_ID:-<none found>}"
          fi
          echo "failed_run_id=${FAILED_RUN_ID}" >> "$GITHUB_OUTPUT"
          echo "failed_workflow=${FAILED_WORKFLOW}" >> "$GITHUB_OUTPUT"
          echo "failed_sha=${FAILED_SHA}" >> "$GITHUB_OUTPUT"
          # Resolve run number / URL / SHA for manual dispatches (the
          # workflow_run payload is null there, so the caller passes empty).
          FAILED_RUN_NUMBER=""
          FAILED_RUN_URL=""
          if [ -n "$FAILED_RUN_ID" ]; then
            META="$(gh run view "$FAILED_RUN_ID" --repo "$GITHUB_REPOSITORY" --json number,url,headSha 2>/dev/null || true)"
            if [ -n "$META" ]; then
              FAILED_RUN_NUMBER="$(printf '%s' "$META" | node -e "let d='';process.stdin.on('data',c=>d+=c).on('end',()=>{try{console.log(JSON.parse(d).number??'')}catch{}})")"
              FAILED_RUN_URL="$(printf '%s' "$META" | node -e "let d='';process.stdin.on('data',c=>d+=c).on('end',()=>{try{console.log(JSON.parse(d).url??'')}catch{}})")"
              if [ -z "$FAILED_SHA" ]; then
                FAILED_SHA="$(printf '%s' "$META" | node -e "let d='';process.stdin.on('data',c=>d+=c).on('end',()=>{try{console.log(JSON.parse(d).headSha??'')}catch{}})")"
                echo "failed_sha=${FAILED_SHA}" >> "$GITHUB_OUTPUT"
              fi
            fi
          fi
          echo "failed_run_number=${FAILED_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          echo "failed_run_url=${FAILED_RUN_URL}" >> "$GITHUB_OUTPUT"
          # Another autofix run already active (excluding this one).
          ACTIVE="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow scheduled-autofix.yml --status in_progress --json databaseId --jq "[.[] | select(.databaseId != ${{ github.run_id }})] | length")"
          if [ "${ACTIVE:-0}" != "0" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Another autofix run is already in progress. Skipping."
            exit 0
          fi
          # Stale failure: a newer completed scheduled run exists for the same workflow.
          # Only applies to automatic (schedule-failure) triggers; a manual dispatch
          # explicitly targets the given run, so never mark it stale here.
          if [ "$EVENT_NAME" = "workflow_run" ] && [ -n "$FAILED_RUN_ID" ] && [ -n "$FAILED_WORKFLOW" ]; then
            LATEST="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow "$FAILED_WORKFLOW" --branch main --event schedule --status completed --limit 1 --json databaseId --jq '.[0].databaseId // empty')"
            if [ -n "$LATEST" ] && [ "$LATEST" != "$FAILED_RUN_ID" ]; then
              echo "skip=true" >> "$GITHUB_OUTPUT"
              echo "Run $FAILED_RUN_ID is superseded by newer run $LATEST. Skipping."
              exit 0
            fi
          fi
          # A real fix already landed on main after the failed commit
          # (bot README status commits don't count). Only applies to
          # automatic triggers; a manual dispatch explicitly targets the
          # given run, so always run there.
          if [ "$EVENT_NAME" = "workflow_run" ] && [ -n "$FAILED_SHA" ]; then
            git fetch origin main --quiet
            AHEAD="$(git rev-list --count "${FAILED_SHA}..origin/main" 2>/dev/null || echo 0)"
            if [ "${AHEAD:-0}" != "0" ]; then
              NONBOT="$(git log "${FAILED_SHA}..origin/main" --format=%s | grep -v -c '^docs: update build status tables' || true)"
              if [ "${NONBOT:-0}" != "0" ]; then
                echo "skip=true" >> "$GITHUB_OUTPUT"
                echo "A fix already landed on main after $FAILED_SHA. Skipping."
                exit 0
              fi
            fi
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Run opencode autofix (push directly to main)
        if: steps.guard.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENCODE_GO_API_KEY: ${{ secrets.OPENCODE_GO_API_KEY }}
          OPENCODE_MODEL: ${{ vars.OPENCODE_MODEL }}
          EVENT_NAME: ${{ github.event_name }}
          FAILED_RUN_ID: ${{ steps.guard.outputs.failed_run_id }}
          FAILED_WORKFLOW: ${{ steps.guard.outputs.failed_workflow }}
          FAILED_SHA: ${{ steps.guard.outputs.failed_sha }}
          FAILED_RUN_NUMBER: ${{ steps.guard.outputs.failed_run_number || github.event.workflow_run.run_number }}
          FAILED_RUN_URL: ${{ steps.guard.outputs.failed_run_url || github.event.workflow_run.html_url }}
        run: |
          if [ -z "$OPENCODE_MODEL" ]; then
            echo "::error::Repository variable OPENCODE_MODEL is not set (expected provider/model, e.g. an OpenCode Go model)."
            exit 1
          fi
          if [ -z "$OPENCODE_GO_API_KEY" ]; then
            echo "::error::Secret OPENCODE_GO_API_KEY is not set."
            exit 1
          fi
          if [ -z "$FAILED_RUN_ID" ]; then
            echo "::error::No failed run found for workflow '${FAILED_WORKFLOW:-<unknown>}'. Pass failed_run_id explicitly."
            exit 1
          fi

          # opencode authenticates via ~/.local/share/opencode/auth.json
          # (created by `/connect` interactively). The secret alone is NOT
          # picked up, so `opencode run` fails with an opaque UnknownError
          # unless we materialize the file headlessly here.
          mkdir -p ~/.local/share/opencode
          OPENCODE_GO_API_KEY="$OPENCODE_GO_API_KEY" node -e "const fs=require('fs'),path=require('path'),os=require('os');const f=path.join(os.homedir(),'.local','share','opencode','auth.json');let cur={};try{cur=JSON.parse(fs.readFileSync(f,'utf8'))}catch{}cur['opencode-go']={type:'api',key:process.env.OPENCODE_GO_API_KEY};fs.writeFileSync(f,JSON.stringify(cur),{mode:0o600});"
          chmod 600 ~/.local/share/opencode/auth.json
          echo "opencode auth configured for provider: $(node -e "try{console.log(Object.keys(JSON.parse(require('fs').readFileSync(require('path').join(require('os').homedir(),'.local','share','opencode','auth.json'),'utf8')))}catch(e){console.log('<unreadable>')}")"

          # Ensure commits (including opencode's) have an identity and push
          # to the right repo even if the agent forgets to configure git.
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          npm i -g opencode-ai --allow-scripts=opencode-ai
          opencode --version

          if [ "$EVENT_NAME" = "workflow_run" ]; then
            TRIGGER_LINE="Scheduled CI failure in ${GITHUB_REPOSITORY} (automatic trigger)."
          else
            TRIGGER_LINE="Manually requested autofix in ${GITHUB_REPOSITORY} (workflow_dispatch)."
          fi

          PROMPT="$(cat <<PROMPT_EOF
          ${TRIGGER_LINE} Push the fix DIRECTLY to \`main\` (no PR).
          NEVER trigger or re-run any workflow (\`gh run rerun\`, \`gh workflow run\` are forbidden).

          - Workflow: ${FAILED_WORKFLOW}
          - Run ID: ${FAILED_RUN_ID} / Number: ${FAILED_RUN_NUMBER} / SHA: ${FAILED_SHA}
          - URL: ${FAILED_RUN_URL}

          1. Identify the cause: \`gh run view ${FAILED_RUN_ID} --repo ${GITHUB_REPOSITORY} --log-failed\`, then inspect the repo.
          2. Fix the root cause (minimal diff) and push DIRECTLY to \`main\`: commit as \`github-actions[bot]\` with message \`fix: auto-fix <workflow> scheduled failure (<run number>)\`, then \`git push origin HEAD:main\` (\`pull --rebase\` and retry once on reject). NEVER publish (\`gh release\`, \`dotnet nuget push\`), NEVER push tags, NEVER edit bot-managed README tables or \`release/*\` branches.
          3. Repeat 1-2 until the cause is resolved (max ~3 attempts, verify with the cheapest relevant local checks). If it is flaky infra with no repo change needed, push nothing.

          Log a short summary at the end: cause, files changed, verification, pushed SHA (or why not).
          PROMPT_EOF
          )"

          opencode run --print-logs --auto --model "$OPENCODE_MODEL" "$PROMPT"
